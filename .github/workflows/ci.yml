name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job ids (backend/frontend/extension) are the check-run names reported to
  # GitHub and referenced by the branch-protection ruleset's required checks.
  backend:
    runs-on: ubuntu-latest
    # Unit tests mock Anthropic, nfl_data_py and Playwright (see tests/conftest.py).
    # They also mocked the DATABASE — and that is why a dozen defects reached
    # production: unique-constraint violations, ON CONFLICT DO NOTHING silently
    # swallowing rows, cursor.rowcount, and VARCHAR overflow are ALL invisible
    # against a MagicMock. tests/integration/ already existed but skipped itself
    # in CI because nothing was listening on 5432, so it was dead weight.
    #
    # A real Postgres now backs both. tests/conftest.py refuses to run the suite
    # at all when DATABASE_URL resolves to a prod host (keyed on host, not on
    # settings.environment), so this cannot be pointed anywhere dangerous.
    services:
      postgres:
        # pgvector, not plain postgres — the schema uses the vector extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: draftmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      SECRET_KEY: ci-dummy-secret-key
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/draftmind_test
      PLATFORM_TOKEN_ENCRYPTION_KEY: LLZjCZi34rSWa-KzVFzNpmWrsj4pMSKTv51SAJv8erU=
      ENVIRONMENT: test
      APP_URL: http://localhost:8000
      # A few endpoint tests run the real auth/OAuth path (no dependency
      # override), so they need these set the way .env provides them locally:
      #  - CLERK_SECRET_KEY enables the Clerk auth path (any non-empty value);
      #    no token is sent, so protected routes correctly return 401.
      #  - YAHOO_* let /auth/yahoo/connect build a redirect instead of erroring.
      CLERK_SECRET_KEY: sk_test_ci-dummy
      YAHOO_CLIENT_ID: ci-dummy-yahoo-client-id
      YAHOO_REDIRECT_URI: http://localhost:8000/auth/yahoo/callback
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (with dev extras for pytest)
        run: uv sync --frozen --extra dev

      # railway.toml runs `alembic upgrade head && uvicorn`, so a broken migration
      # is a production OUTAGE, not a failed deploy. Running it here is the only
      # place that can catch one before it boots.
      - name: Apply migrations
        run: uv run alembic upgrade head

      # Running it twice proves idempotency. A migration that succeeds once and
      # fails on re-run takes prod down on the next restart, not on deploy — the
      # worst possible time to find out.
      - name: Migrations are idempotent
        run: uv run alembic upgrade head

      - name: Run backend unit tests
        run: uv run pytest tests/unit/ -x -q

      # These exercise real Postgres semantics — constraints, ON CONFLICT, rowcount.
      # Not -x: an integration failure should report every broken invariant, not
      # just the first one.
      - name: Run backend integration tests
        run: uv run pytest tests/integration/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install extension deps
        run: npm ci
        working-directory: extension

      - name: Run extension tests
        run: npm test
        working-directory: extension

      - name: Build extension
        run: npm run build
        working-directory: extension
